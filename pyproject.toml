[build-system]
requires = ["setuptools==70.0.0", "torch", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "VGGT-SLAM"
version = "0.0.1"
requires-python = ">= 3.10"
dependencies = [
    "numpy==1.26.4",
    "einops",
    "pyrealsense2",
    "evo",
    "natsort",
    # "torchcodec==0.1",
    #"lietorch @ git+https://github.com/princeton-vl/lietorch.git",
    #"lietorch @ git+https://github.com/hectorpiteau/lietorch.git",
    "lietorch @ git+https://github.com/PR5GRAMM2R/lietorch.git",
    "plyfile",
    "Pillow",
    "huggingface_hub",
    "einops",
    "safetensors",
    "opencv-python",
]

[project.optional-dependencies]
demo = [
    "gradio==5.17.1",
    "viser==0.2.23",
    "tqdm",
    "hydra-core",
    "omegaconf",
    "opencv-python",
    "scipy",
    "onnxruntime",
    "requests",
    "trimesh",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mast3r_slam", "vggt*"]
namespaces = false

# Pixi configuration
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
vggt = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
demo = { features = ["demo"], solve-group = "default" }

[tool.pixi.tasks]
